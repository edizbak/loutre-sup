rule_files:
  - /workspace/prometheus-rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics"}'
        values: "0+0x6"
    alert_rule_test:
      - eval_time: 5m
        alertname: MonitoringTargetDown
        exp_alerts:
          - exp_labels:
              instance: kube-state-metrics
              job: kube-state-metrics
              severity: warning
            exp_annotations:
              summary: Monitoring target is down
              description: >-
                Scrape target kube-state-metrics at kube-state-metrics has been
                unavailable for five minutes.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="demo", deployment="web"}'
        values: "3+0x11"
      - series: 'kube_deployment_status_replicas_available{namespace="demo", deployment="web"}'
        values: "1+0x11"
      - series: 'kube_node_status_condition{node="server",condition="Ready",status="true"}'
        values: "0+0x6"
      - series: 'kube_node_info{node="server"}'
        values: "1+0x6"
    alert_rule_test:
      - eval_time: 10m
        alertname: KubernetesDeploymentUnavailable
        exp_alerts:
          - exp_labels:
              deployment: web
              namespace: demo
              severity: warning
            exp_annotations:
              summary: Kubernetes deployment has unavailable replicas
              description: >-
                Deployment demo/web has fewer available replicas than desired
                for ten minutes.
      - eval_time: 5m
        alertname: KubernetesNodeNotReady
        exp_alerts:
          - exp_labels:
              node: server
              condition: Ready
              status: "true"
              severity: critical
            exp_annotations:
              summary: Kubernetes node is not ready
              description: >-
                Node server has not reported Ready for five minutes.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics"}'
        values: "1+0x6"
    alert_rule_test:
      - eval_time: 5m
        alertname: MonitoringTargetDown
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="kube-state-metrics"}'
        values: "1+0x6"
    alert_rule_test:
      - eval_time: 5m
        alertname: KubernetesNodeMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Kubernetes node metrics are missing
              description: >-
                kube-state-metrics has not reported any Kubernetes node for five
                minutes.
  - interval: 1m
    input_series:
      - series: 'metrics_server_exporter_up{job="metrics-server-exporter"}'
        values: "0+0x6"
    alert_rule_test:
      - eval_time: 5m
        alertname: MetricsServerExporterUnavailable
        exp_alerts:
          - exp_labels:
              job: metrics-server-exporter
              severity: warning
            exp_annotations:
              summary: Metrics Server API exporter is unavailable
              description: >-
                The Metrics Server API exporter has failed to collect metrics for
                five minutes.
