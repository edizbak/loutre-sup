apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-dev-deployer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-dev-deployer
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - endpoints
      - events
      - pods
      - pods/log
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-dev-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-dev-deployer
subjects:
  - kind: ServiceAccount
    name: monitoring-dev-deployer
    namespace: monitoring-dev
