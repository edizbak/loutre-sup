global:
  evaluation_interval: 30s
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus.monitoring-dev.svc:9090
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics.monitoring-dev.svc:8080
  - job_name: metrics-server-exporter
    static_configs:
      - targets:
          - metrics-server-exporter.monitoring-dev.svc:9100
rule_files:
  - /etc/prometheus/prometheus-rules.yml
