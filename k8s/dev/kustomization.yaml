apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring-dev
resources:
  - config.yaml
  - rbac.yaml
  - workloads.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
      - prometheus-rules.yml
  - name: grafana-dashboards
    files:
      - dashboards/cluster-overview.json
